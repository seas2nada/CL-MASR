# ############################################################################
# Model: Whisper (encoder-decoder) + cross-entropy loss
# Method: Bottleneck Adapter (per-locale independent)
# ############################################################################

experiment_name: Adapter

seed: 0
__set_seed: !apply:torch.manual_seed [!ref <seed>]

skip_test: False

# Data preparation
base_locales: [en]
new_locales: [rw, eo, kab, lg, mhr, ckb, ab, kmr, fy-NL, ia]
data_folder: !PLACEHOLDER
max_durations: [36000, 3600, 3600]  # train/dev/test per locale (seconds)

# Output directories
output_folder: !ref results/<whisper_variant>/<experiment_name>/<seed>
save_folder: !ref <output_folder>/save

# Training parameters
train_batch_size: 6
valid_batch_size: 16
train_num_workers: 6
valid_num_workers: 6

sample_rate: 16000
sorting: ascending
avoid_if_longer_than: 10

ignore_index: -100
label_smoothing: 0

num_epochs: 10
lr: 0.0003
improvement_threshold: 0.0025
annealing_factor: 0.8

# === Adapter-specific ===
adapter_dim: 64            # bottleneck size
adapter_dropout: 0.0
per_locale_add_lang_token: True
eval_base_before: False
train_embeddings: True    # 권장: False (True면 전체 embedding이 열림)
freeze_encoder: True       # True면 encoder adapter 안 붙임 + encoder 고정

# Whisper
whisper_variant: whisper-large-v2
encoder_only: False
freeze: False

max_target_length: 448
nonfinite_patience: 10
max_grad_norm: 5.0
precision: fp16
gradient_checkpointing: False
ckpt_interval_minutes: 600

max_gen_tokens: 80
forced_decoder_locale: null
normalize_transcripts: True

# Dataloader options
train_dataloader_kwargs:
    batch_size: !ref <train_batch_size>
    num_workers: !ref <train_num_workers>

valid_dataloader_kwargs:
    batch_size: !ref <valid_batch_size>
    num_workers: !ref <valid_num_workers>

# Modules
whisper: !new:model.ProgressiveWhisper
    source: !ref openai/<whisper_variant>
    save_path: !ref <save_folder>/checkpoint
    sampling_rate: !ref <sample_rate>
    encoder_only: !ref <encoder_only>
    freeze: !ref <freeze>
    freeze_encoder: !ref <freeze_encoder>

ce_loss: !new:torch.nn.CrossEntropyLoss
    ignore_index: !ref <ignore_index>
    label_smoothing: !ref <label_smoothing>

modules:
    whisper: !ref <whisper>
    # NOTE: enc_adapters/dec_adapters는 train_adapter.py가 런타임에 modules에 추가함

# Optimizers
opt_class: !name:torch.optim.AdamW
    lr: !ref <lr>

lr_annealing: !new:speechbrain.nnet.schedulers.NewBobScheduler
    initial_value: !ref <lr>
    improvement_threshold: !ref <improvement_threshold>
    annealing_factor: !ref <annealing_factor>
    patient: 0

# Performance metrics
wer_computer: !name:speechbrain.utils.metric_stats.ErrorRateStats

cer_computer: !name:speechbrain.utils.metric_stats.ErrorRateStats
    split_tokens: True

# Counters, checkpointers, loggers
epoch_counter: !new:speechbrain.utils.epoch_loop.EpochCounter
    limit: !ref <num_epochs>

checkpointer: !new:speechbrain.utils.checkpoints.Checkpointer
    checkpoints_dir: !ref <save_folder>
    recoverables:
        model: !ref <whisper>
        scheduler: !ref <lr_annealing>
        counter: !ref <epoch_counter>

train_logger: !new:speechbrain.utils.train_logger.FileTrainLogger
    save_file: !ref <output_folder>/<experiment_name>.txt
